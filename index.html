<html lang="ar" dir="rtl">
<head>

    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --primary: #1e293b;
      --accent: #0f766e;
      --accent-light: #f0fdfa;
      --accent-border: #99f6e4;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      background: var(--surface);
      padding: 16px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-outline {
      background: #f8fafc;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: #e2e8f0;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #115e59;
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 18px 22px;
      padding-left: 52px;
      font-size: 1.2rem;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-main);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .clear-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: #e2e8f0;
      color: #475569;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn.visible {
      display: flex;
    }

    .branch-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }

    .branch-filters::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: #e2e8f0;
      color: #334155;
    }

    .sync-badge.live {
      background: #dcfce7;
      color: #166534;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .area-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .area-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .area-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .multi-tag {
      font-size: 0.75rem;
      background: #fef3c7;
      color: #92400e;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .branch-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .branch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .branch-row.best {
      background: var(--accent-light);
      border: 2px solid var(--accent-border);
    }

    .branch-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .branch-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .best-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .alt-badge {
      background: #e2e8f0;
      color: #475569;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .price-tag {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    .branch-row:not(.best) .price-tag {
      color: var(--primary);
      font-size: 1.15rem;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 540px;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      direction: ltr;
    }

    .help-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>📍 دليل التوصيل والأفرع</h1>
      <p>ابحث باسم المنطقة لمعرفة الفرع المسؤول وقيمة التوصيل فوراً</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="openModal()">⚙️ ربط Google Sheets / تحديث</button>
    </div>
  </header>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="اكتب اسم المنطقة (مثلاً: خلدا، عبدون، الجاردنز...)"
      autocomplete="off"
      autofocus
    />
    <button id="clearBtn" class="clear-btn" onclick="clearSearch()" title="مسح البحث">✕</button>
  </div>

  <div class="branch-filters" id="branchFilters"></div>

  <div class="stats-bar">
    <span id="resultsCount">جاري التحميل...</span>
    <span id="syncStatus" class="sync-badge">البيانات المدمجة (149 سجل)</span>
  </div>

  <div class="results-list" id="resultsList"></div>
</div>

<!-- Settings / Google Sheets Sync Modal -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>⚙️ ربط وتحديث البيانات مع Google Sheets</h2>
      <button class="btn btn-outline" onclick="closeModal()">إغلاق</button>
    </div>

    <div class="form-group">
      <label>1. رابط ملف Google Sheets المنشور بصيغة CSV:</label>
      <input
        type="url"
        id="csvUrlInput"
        class="form-control"
        placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv"
      />
      <p class="help-text">
        من Google Sheets: اختر <strong>ملف (File) ← مشاركة (Share) ← النشر على الويب (Publish to web)</strong>، اختر صيغة <strong>CSV</strong>، انسخ الرابط والصقه هنا.
      </p>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveAndSyncSheet()">💾 حفظ وتحديث البيانات الآن</button>
      <button class="btn btn-outline" onclick="downloadCSV()">📥 تحميل ملف CSV جاهز للرفع</button>
      <button class="btn btn-outline" onclick="resetToDefault()">🔄 استعادة البيانات الافتراضية</button>
    </div>
  </div>
</div>

  let activeData = [...DEFAULT_DATA];
  let selectedBranch = "الكل";

  function normalizeArabic(text) {
    if (!text) return "";
    return text
      .toString()
      .trim()
      .toLowerCase()
      .replace(/[أإآ]/g, "ا")
      .replace(/ة/g, "ه")
      .replace(/ى/g, "ي")
      .replace(/^ال/, "")
      .replace(/\s+ال/g, " ")
      .replace(/\s+/g, " ");
  }

  function renderBranchFilters() {
    const branches = ["الكل", ...new Set(activeData.map(item => item.branch))];
    const container = document.getElementById("branchFilters");
    container.innerHTML = branches.map(branch => `
      <button
        class="filter-chip ${selectedBranch === branch ? "active" : ""}"
        onclick="selectBranch('${branch}')"
      >
        ${branch}
      </button>
    `).join("");
  }

  function selectBranch(branch) {
    selectedBranch = branch;
    renderBranchFilters();
    renderResults();
  }

  function clearSearch() {
    const input = document.getElementById("searchInput");
    input.value = "";
    input.focus();
    document.getElementById("clearBtn").classList.remove("visible");
    renderResults();
  }

  function renderResults() {
    const query = document.getElementById("searchInput").value;
    const normQuery = normalizeArabic(query);
    const clearBtn = document.getElementById("clearBtn");

    if (query.trim().length > 0) {
      clearBtn.classList.add("visible");
    } else {
      clearBtn.classList.remove("visible");
    }

    const filtered = activeData.filter(item => {
      const matchBranch = selectedBranch === "الكل" || item.branch === selectedBranch;
      const matchQuery = !normQuery || normalizeArabic(item.area).includes(normQuery);
      return matchBranch && matchQuery;
    });

    // Group by normalized area name
    const groupedMap = new Map();
    filtered.forEach(item => {
      const key = normalizeArabic(item.area);
      if (!groupedMap.has(key)) {
        groupedMap.set(key, {
          displayName: item.area,
          options: []
        });
      }
      groupedMap.get(key).options.push(item);
    });

    const groups = Array.from(groupedMap.values());
    groups.forEach(group => {
      group.options.sort((a, b) => a.price - b.price);
    });

    document.getElementById("resultsCount").textContent = `عدد المناطق المطابقة: ${groups.length}`;
    const listEl = document.getElementById("resultsList");

    if (groups.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <h3>لا توجد نتائج مطابقة لـ "${query}"</h3>
          <p>تأكد من كتابة اسم المنطقة أو اختر "الكل" من الأفرع في الأعلى</p>
        </div>
      `;
      return;
    }

    listEl.innerHTML = groups.map(group => {
      const isMulti = group.options.length > 1;
      const minPrice = group.options[0].price;

      const optionsHtml = group.options.map((opt, idx) => {
        const isBest = idx === 0;
        return `
          <div class="branch-row ${isBest ? "best" : ""}">
            <div class="branch-info">
              <span class="branch-name">${opt.branch}</span>
              ${isBest
                ? `<span class="best-badge">${isMulti ? "الأقل تكلفة / الموصى به" : "الفرع المسؤول"}</span>`
                : `<span class="alt-badge">فرع بديل</span>`
              }
            </div>
            <div class="price-tag">${Number(opt.price).toFixed(2)} د.أ</div>
          </div>
        `;
      }).join("");

      return `
        <div class="area-card">
          <div class="area-header">
            <span class="area-title">${group.displayName}</span>
            ${isMulti ? `<span class="multi-tag">مشتركة بين ${group.options.length} أفرع</span>` : ""}
          </div>
          <div class="branch-options">
            ${optionsHtml}
          </div>
        </div>
      `;
    }).join("");
  }

  // Modal & Google Sheets Sync
  function openModal() {
    document.getElementById("csvUrlInput").value = localStorage.getItem("sheets_csv_url") || "";
    document.getElementById("settingsModal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("settingsModal").classList.remove("open");
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return [];
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split(",").map(p => p.replace(/^"|"$/g, "").trim());
      if (parts.length >= 3) {
        const area = parts[0];
        const branch = parts[1];
        const price = parseFloat(parts[2]);
        if (area && branch && !isNaN(price)) {
          result.push({ area, branch, price });
        }
      }
    }
    return result;
  }

  async function fetchSheetData(url) {
    const statusEl = document.getElementById("syncStatus");
    statusEl.textContent = "جاري المزامنة مع Google Sheets...";
    statusEl.classList.remove("live");

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Network error");
      const csvText = await response.text();
      const parsed = parseCSV(csvText);
      if (parsed.length > 0) {
        activeData = parsed;
        localStorage.setItem("cached_delivery_data", JSON.stringify(parsed));
        statusEl.textContent = `مربوط مع Google Sheets (${parsed.length} سجل)`;
        statusEl.classList.add("live");
        renderBranchFilters();
        renderResults();
        return true;
      } else {
        throw new Error("Empty or invalid CSV format");
      }
    } catch (err) {
      statusEl.textContent = "تعذر الاتصال (يعمل بالبيانات المحفوظة)";
      return false;
    }
  }

  async function saveAndSyncSheet() {
    const url = document.getElementById("csvUrlInput").value.trim();
    if (!url) {
      alert("يرجى إدخال رابط CSV الصحيح من Google Sheets.");
      return;
    }
    localStorage.setItem("sheets_csv_url", url);
    const ok = await fetchSheetData(url);
    if (ok) {
      alert("تم الربط وتحديث البيانات بنجاح!");
      closeModal();
    } else {
      alert("تعذر قراءة البيانات من الرابط. تأكد من نشر الملف بصيغة CSV وتطابق الأعمدة (المنطقة، الفرع، السعر).");
    }
  }

  function resetToDefault() {
    localStorage.removeItem("sheets_csv_url");
    localStorage.removeItem("cached_delivery_data");
    activeData = [...DEFAULT_DATA];
    document.getElementById("csvUrlInput").value = "";
    document.getElementById("syncStatus").textContent = `البيانات المدمجة (${activeData.length} سجل)`;
    document.getElementById("syncStatus").classList.remove("live");
    renderBranchFilters();
    renderResults();
    alert("تمت استعادة البيانات الافتراضية بنجاح.");
  }

  function downloadCSV() {
    const bom = "\uFEFF";
    const header = "المنطقة,الفرع,السعر\n";
    const rows = activeData.map(r => `"${r.area}","${r.branch}",${Number(r.price).toFixed(2)}`).join("\n");
    const blob = new Blob([bom + header + rows], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "delivery_rates.csv";
    link.click();
  }

  // Initialization
  document.getElementById("searchInput").addEventListener("input", renderResults);

  window.addEventListener("DOMContentLoaded", () => {
    const cached = localStorage.getItem("cached_delivery_data");
    if (cached) {
      try {
        activeData = JSON.parse(cached);
      } catch (e) {}
    }
    renderBranchFilters();
    renderResults();

    const savedUrl = localStorage.getItem("sheets_csv_url");
    if (savedUrl) {
      fetchSheetData(savedUrl);
    }
  });
</script>
