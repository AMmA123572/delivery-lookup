<html lang="ar" dir="rtl">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --dark-pill: #0f172a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --green-border: #34d399;
      --blue: #2563eb;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #8b5cf6;
      --teal: #0d9488;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.06);
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 18px 16px 60px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Top Search Bar */
    .search-wrapper {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
    }

    .search-icon {
      color: #64748b;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      padding: 6px 4px;
    }

    .search-input::placeholder {
      color: #94a3b8;
      font-weight: 600;
    }

    .esc-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .esc-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .admin-gear-btn {
      display: none;
      background: #0f172a;
      color: #fff;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .admin-gear-btn.visible {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Filter Chips Bar */
    .filters-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }

    .filters-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: #94a3b8;
    }

    .chip.active {
      background: var(--dark-pill);
      color: #ffffff;
      border-color: var(--dark-pill);
    }

    .chip.active .chip-count {
      color: #cbd5e1;
    }

    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .chip-count {
      font-weight: 700;
      color: #64748b;
      font-size: 0.8rem;
    }

    /* Info Strip */
    .info-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 700;
    }

    .info-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .info-note-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .count-summary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #475569;
    }

    .count-badge {
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 7px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s, background-color 0.15s;
    }

    .count-badge:active {
      transform: scale(0.95);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 760px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .area-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .area-card.recommended {
      border-color: var(--green-border);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .tags-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .branch-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #1e293b;
    }

    .best-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #10b981;
      color: #ffffff;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .area-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.25;
      margin-top: 2px;
    }

    /* Dark Price Box */
    .price-box {
      background: #0f172a;
      color: #ffffff;
      border-radius: 14px;
      min-width: 86px;
      padding: 10px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .price-num {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.3px;
    }

    .price-currency {
      font-size: 0.76rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* Card Bottom */
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      gap: 10px;
    }

    .copy-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .copy-btn.copied {
      background: #ecfdf5;
      border-color: #34d399;
      color: #047857;
    }

    .coverage-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 44px 20px;
      text-align: center;
      color: #64748b;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Admin Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.88rem;
      direction: ltr;
      margin-top: 8px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn-m {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-m-primary {
      background: #0f172a;
      color: #fff;
    }

    .btn-m-light {
      background: #f1f5f9;
      color: #0f172a;
    }
  </style>
</head>

<div class="container">
  <!-- Search Box -->
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      id="searchInput"
      class="search-input"

      autocomplete="off"
      autofocus
    />
    <button class="esc-btn" id="escBtn" onclick="clearSearch()" title="مسح البحث">ESC للمسح</button>
    <button class="admin-gear-btn" id="adminGearBtn" onclick="openModal()">⚙️ ربط الشيت</button>
  </div>

  <!-- Branch Filter Chips -->
  <div class="filters-bar" id="filtersBar"></div>

  <!-- Info Strip -->
  <div class="info-strip">
    <div class="info-note">
      <span class="info-note-dot"></span>
      <span>يتم ترتيب المناطق المشتركة تلقائياً حسب الأقل تكلفة / الأقرب أولاً</span>
    </div>
    <div class="count-summary">
      <span class="count-badge" id="totalBadge" onclick="handleSecretTap()" title="العداد">149</span>
      <span id="countLabel">منطقة في جميع الأفرع</span>
    </div>
  </div>

  <!-- Results Grid -->
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Admin Modal -->
<div class="modal-backdrop" id="adminModal">
  <div class="modal">
    <div class="modal-header">
      <h2>⚙️ ربط وتحديث البيانات (Google Sheets CSV)</h2>
      <button class="btn-m btn-m-light" onclick="closeModal()">إغلاق</button>
    </div>
    <label style="font-size: 0.88rem; font-weight: 700;">رابط النشر بصيغة CSV من Google Sheets:</label>
    <input type="url" id="csvInput" class="form-control" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" />
    <div class="modal-actions">
      <button class="btn-m btn-m-primary" onclick="syncSheet()">حفظ ومزامنة</button>
      <button class="btn-m btn-m-light" onclick="exportCSV()">تحميل CSV</button>
      <button class="btn-m btn-m-light" onclick="resetData()">استعادة الافتراضي</button>
    </div>
  </div>
</div>

  let activeData = [...DEFAULT_DATA];
  let selectedBranch = "الكل";

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  function handleSecretTap() {
    secretTapCount++;
    clearTimeout(secretTapTimer);
    secretTapTimer = setTimeout(() => {
      secretTapCount = 0;
    }, 1800);

    if (secretTapCount >= 5) {
      secretTapCount = 0;
      isAdminUnlocked = !isAdminUnlocked;
      const btn = document.getElementById("adminGearBtn");
      if (isAdminUnlocked) {
        btn.classList.add("visible");
        showToast("تم إظهار خيار ربط الشيت");
      } else {
        btn.classList.remove("visible");
        showToast("تم إخفاء خيار ربط الشيت");
      }
    }
  }

  function normalizeArabic(text) {
    if (!text) return "";
    return text
      .toString()
      .trim()
      .toLowerCase()
      .replace(/[أإآ]/g, "ا")
      .replace(/ة/g, "ه")
      .replace(/ى/g, "ي")
      .replace(/^ال/, "")
      .replace(/\s+ال/g, " ")
      .replace(/\s+/g, " ");
  }

  function cleanBranchName(name) {
    return (name || "").replace(/^فرع\s+/, "").trim();
  }

  function getBranchColor(branch) {
    const clean = cleanBranchName(branch);
    return BRANCH_COLORS[clean] || "#0f766e";
  }

  function getBranchCounts(data) {
    const counts = {};
    data.forEach(item => {
      const b = cleanBranchName(item.branch);
      counts[b] = (counts[b] || 0) + 1;
    });
    return counts;
  }

  function renderChips() {
    const counts = getBranchCounts(activeData);
    const branchOrder = ["المدينة المنورة", "غوشة", "دابوق", "جبيهة", "صويفية", "المقابلين"];
    const extraBranches = Object.keys(counts).filter(b => !branchOrder.includes(b));
    const allBranches = [...branchOrder.filter(b => counts[b] > 0), ...extraBranches];

    const bar = document.getElementById("filtersBar");
    let html = `
      <button class="chip ${selectedBranch === "الكل" ? "active" : ""}" onclick="selectBranch('الكل')">
        <span>الكل</span>
        <span class="chip-count">(${activeData.length})</span>
      </button>
    `;

    allBranches.forEach(b => {
      const isActive = selectedBranch === b;
      const color = getBranchColor(b);
      html += `
        <button class="chip ${isActive ? "active" : ""}" onclick="selectBranch('${b.replace(/'/g, "\'")}')">
          <span class="chip-dot" style="background:${color}"></span>
          <span>${b}</span>
          <span class="chip-count">(${counts[b]})</span>
        </button>
      `;
    });

    bar.innerHTML = html;
  }

  function selectBranch(branch) {
    selectedBranch = branch;
    renderChips();
    renderCards();
  }

  function clearSearch() {
    const input = document.getElementById("searchInput");
    input.value = "";
    input.focus();
    renderCards();
  }

  function copyCardDetails(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.innerHTML;
      btn.classList.add("copied");
      btn.innerHTML = "✓ تم النسخ";
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerHTML = orig;
      }, 1500);
    });
  }

  function renderCards() {
    const query = document.getElementById("searchInput").value;
    const normQuery = normalizeArabic(query);

    const areaBranchCount = new Map();
    const areaMinPrice = new Map();
    activeData.forEach(item => {
      const key = normalizeArabic(item.area);
      if (!areaBranchCount.has(key)) areaBranchCount.set(key, new Set());
      areaBranchCount.get(key).add(cleanBranchName(item.branch));

      const p = Number(item.price);
      if (!areaMinPrice.has(key) || p < areaMinPrice.get(key)) {
        areaMinPrice.set(key, p);
      }
    });

    const filtered = activeData.filter(item => {
      const bName = cleanBranchName(item.branch);
      const matchBranch = selectedBranch === "الكل" || bName === selectedBranch;
      const matchQuery = !normQuery || normalizeArabic(item.area).includes(normQuery);
      return matchBranch && matchQuery;
    });

    filtered.sort((a, b) => Number(a.price) - Number(b.price));

    document.getElementById("totalBadge").textContent = filtered.length;
    document.getElementById("countLabel").textContent =
      selectedBranch === "الكل" ? "منطقة في جميع الأفرع" : `منطقة في فرع ${selectedBranch}`;

    const grid = document.getElementById("cardsGrid");

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>لا توجد نتائج مطابقة</h3>
          <p style="margin-top:6px;">جرّب البحث باسم منطقة أخرى أو اضغط على "الكل"</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map(item => {
      const bName = cleanBranchName(item.branch);
      const color = getBranchColor(bName);
      const key = normalizeArabic(item.area);
      const totalBranchesForArea = areaBranchCount.get(key)?.size || 1;
      const minPrice = areaMinPrice.get(key);
      const priceNum = Number(item.price);
      const isLowest = totalBranchesForArea > 1 && priceNum === minPrice;
      const isMulti = totalBranchesForArea > 1;

      const copyText = `المنطقة: ${item.area} | الفرع: ${bName} | التوصيل: ${priceNum.toFixed(2)} دينار`;
      const safeCopyText = copyText.replace(/'/g, "\'");

      return `
        <div class="area-card ${isLowest ? "recommended" : ""}">
          <div class="card-top">
            <div class="card-info">
              <div class="tags-row">
                <span class="branch-pill">
                  <span class="chip-dot" style="background:${color}"></span>
                  <span>${bName}</span>
                </span>
                ${isLowest ? `<span class="best-pill">★ الأقرب / الأقل تكلفة</span>` : ""}
              </div>
              <div class="area-name">${item.area}</div>
            </div>

            <div class="price-box">
              <span class="price-num">${priceNum.toFixed(2)}</span>
              <span class="price-currency">دينار</span>
            </div>
          </div>

          <div class="card-bottom">
            <button class="copy-btn" onclick="copyCardDetails(this, '${safeCopyText}')">
              <span>📋</span>
              <span>نسخ التفاصيل</span>
            </button>
            <span class="coverage-text">
              ${isMulti ? `متوفرة في ${totalBranchesForArea} أفرع` : "تغطية حصرية لهذا الفرع"}
            </span>
          </div>
        </div>
      `;
    }).join("");
  }

  function openModal() {
    if (!isAdminUnlocked) return;
    document.getElementById("csvInput").value = localStorage.getItem("sheets_csv_url") || "";
    document.getElementById("adminModal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("adminModal").classList.remove("open");
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return [];
    const out = [];
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split(",").map(p => p.replace(/^"|"$/g, "").trim());
      if (parts.length >= 3) {
        const area = parts[0];
        const branch = parts[1];
        const price = parseFloat(parts[2]);
        if (area && branch && !isNaN(price)) {
          out.push({ area, branch, price });
        }
      }
    }
    return out;
  }

  async function syncSheet() {
    if (!isAdminUnlocked) return;
    const url = document.getElementById("csvInput").value.trim();
    if (!url) return alert("يرجى إدخال رابط CSV");
    try {
      const res = await fetch(url);
      const csv = await res.text();
      const parsed = parseCSV(csv);
      if (!parsed.length) throw new Error("Empty");
      activeData = parsed;
      localStorage.setItem("sheets_csv_url", url);
      localStorage.setItem("cached_delivery_data", JSON.stringify(parsed));
      selectedBranch = "الكل";
      renderChips();
      renderCards();
      closeModal();
      alert("تم تحديث البيانات بنجاح!");
    } catch (e) {
      alert("تعذر قراءة الرابط، تأكد من نشر الشيت بصيغة CSV.");
    }
  }

  function exportCSV() {
    if (!isAdminUnlocked) return;
    const bom = "\uFEFF";
    const header = "المنطقة,الفرع,السعر\n";
    const rows = activeData.map(r => `"${r.area}","${cleanBranchName(r.branch)}",${Number(r.price).toFixed(2)}`).join("\n");
    const blob = new Blob([bom + header + rows], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "delivery_rates.csv";
    a.click();
  }

  function resetData() {
    if (!isAdminUnlocked) return;
    localStorage.removeItem("sheets_csv_url");
    localStorage.removeItem("cached_delivery_data");
    activeData = [...DEFAULT_DATA];
    selectedBranch = "الكل";
    renderChips();
    renderCards();
    closeModal();
  }

  document.getElementById("searchInput").addEventListener("input", renderCards);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") clearSearch();
  });

  window.addEventListener("DOMContentLoaded", () => {
    if (isAdminUnlocked) {
      document.getElementById("adminGearBtn").classList.add("visible");
    }
    const cached = localStorage.getItem("cached_delivery_data");
    if (cached) {
      try {
        activeData = JSON.parse(cached);
      } catch (e) {}
    }
    renderChips();
    renderCards();

    const savedUrl = localStorage.getItem("sheets_csv_url");
    if (savedUrl) {
      fetch(savedUrl)
        .then(r => r.text())
        .then(txt => {
          const parsed = parseCSV(txt);
          if (parsed.length) {
            activeData = parsed;
            localStorage.setItem("cached_delivery_data", JSON.stringify(parsed));
            renderChips();
            renderCards();
          }
        })
        .catch(() => {});
    }
  });
