<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التوصيل والأفرع - الخريطة التفاعلية</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #0d0917;
      --card-bg: #171029;
      --card-border: #2e1f54;
      --accent-purple: #6f38e8;
      --accent-gold: #e5b84b;
      --text-main: #f5f2fc;
      --text-muted: #b8aed1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-gold);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 680px;
    }

    .controls input {
      flex: 1;
      min-width: 210px;
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    .controls input:focus {
      border-color: var(--accent-gold);
    }

    .btn {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn.secondary {
      background: #271b45;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn:hover {
      opacity: 0.9;
    }

    .branches-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .branch-chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .branch-chip.active,
    .branch-chip:hover {
      border-color: var(--accent-gold);
      background: #241842;
      color: var(--accent-gold);
    }

    .map-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    #map {
      width: 100%;
      height: 460px;
      min-height: 360px;
      border-radius: 12px;
      overflow: hidden;
      z-index: 1;
    }

    .status-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .badge {
      background: #231740;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .badge strong {
      color: var(--accent-gold);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <span>التوصيل والأفرع</span>
      </div>
      <div class="controls">
        <input
          type="text"
          id="areaSearchInput"
          placeholder="ابحث عن منطقة أو فرع (مثال: وسط عمان، جبيهة، صويلح، دابوق)..."
          aria-label="ابحث عن منطقة أو معلم"
        />
        <button type="button" class="btn" id="searchBtn">بحث</button>
        <button type="button" class="btn secondary" id="clearSearchBtn">مسح البحث</button>
      </div>
    </header>

    <div class="branches-bar" id="branchesBar"></div>

    <main class="map-wrapper">
      <div id="map"></div>
    </main>

    <footer class="status-bar">
      <div class="status-group">
        <span class="badge">الأصناف ومحتوياتها: <strong id="itemsCount">0</strong></span>
        <span class="badge">الخريطة التفاعلية: <strong id="mapStatus">0</strong></span>
      </div>
      <div class="status-group">
        <span id="selectedZoneLabel">المنطقة المحددة: وسط عمان</span>
        <span class="badge">وضع محلي جاهز</span>
      </div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // بيانات مبدئية للأفرع ونطاقات التوصيل في عمان (يمكن استبدالها ببيانات JSONBin أو API)
    const branchesData = [
      {
        id: "downtown",
        name: "وسط عمان",
        lat: 31.9515,
        lng: 35.9339,
        radiusMeters: 2200,
        itemsCount: 24,
        deliveryFee: "1.50 د.أ"
      },
      {
        id: "jubeiha",
        name: "جبيهة",
        lat: 32.0218,
        lng: 35.8685,
        radiusMeters: 2600,
        itemsCount: 31,
        deliveryFee: "2.00 د.أ"
      },
      {
        id: "sweileh",
        name: "صويلح",
        lat: 32.0315,
        lng: 35.8442,
        radiusMeters: 2500,
        itemsCount: 19,
        deliveryFee: "2.00 د.أ"
      },
      {
        id: "dabouq",
        name: "دابوق",
        lat: 31.9952,
        lng: 35.8336,
        radiusMeters: 2700,
        itemsCount: 28,
        deliveryFee: "2.50 د.أ"
      },
      {
        id: "muqabalain",
        name: "المقابلين",
        lat: 31.9087,
        lng: 35.9314,
        radiusMeters: 2400,
        itemsCount: 22,
        deliveryFee: "1.75 د.أ"
      }
    ];

    let map;
    let markersLayer;
    let zonesLayer;

    function initMap() {
      const defaultBranch = branchesData[0];

      map = L.map("map", {
        center: [defaultBranch.lat, defaultBranch.lng],
        zoom: 12,
        zoomControl: true
      });

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      zonesLayer = L.layerGroup().addTo(map);

      renderBranchesBar();
      renderMapLayers(branchesData);
      updateCounters(branchesData, defaultBranch.name);

      // ضمان حساب أبعاد الخريطة بدقة بعد التحميل
      setTimeout(() => {
        map.invalidateSize();
      }, 150);
    }

    function renderBranchesBar(activeId = branchesData[0].id) {
      const bar = document.getElementById("branchesBar");
      bar.innerHTML = "";

      branchesData.forEach((branch) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = `branch-chip ${branch.id === activeId ? "active" : ""}`;
        chip.textContent = branch.name;
        chip.addEventListener("click", () => {
          focusBranch(branch);
          renderBranchesBar(branch.id);
        });
        bar.appendChild(chip);
      });
    }

    function renderMapLayers(dataList) {
      markersLayer.clearLayers();
      zonesLayer.clearLayers();

      dataList.forEach((branch) => {
        const marker = L.marker([branch.lat, branch.lng]).bindPopup(
          `<strong>${branch.name}</strong><br/>رسوم التوصيل: ${branch.deliveryFee}<br/>الأصناف المتاحة: ${branch.itemsCount}`
        );
        marker.on("click", () => {
          document.getElementById("selectedZoneLabel").textContent = `المنطقة المحددة: ${branch.name}`;
          renderBranchesBar(branch.id);
        });
        marker.addTo(markersLayer);

        const circle = L.circle([branch.lat, branch.lng], {
          radius: branch.radiusMeters,
          color: "#e5b84b",
          fillColor: "#6f38e8",
          fillOpacity: 0.2,
          weight: 2
        }).addTo(zonesLayer);
      });
    }

    function focusBranch(branch) {
      map.setView([branch.lat, branch.lng], 13, { animate: true });
      document.getElementById("selectedZoneLabel").textContent = `المنطقة المحددة: ${branch.name}`;
      updateCounters(branchesData, branch.name);
      map.invalidateSize();
    }

    function updateCounters(list, activeName) {
      const totalItems = list.reduce((sum, item) => sum + (Number(item.itemsCount) || 0), 0);
      document.getElementById("itemsCount").textContent = totalItems;
      document.getElementById("mapStatus").textContent = list.length;
      if (activeName) {
        document.getElementById("selectedZoneLabel").textContent = `المنطقة المحددة: ${activeName}`;
      }
    }

    function handleSearch() {
      const query = document.getElementById("areaSearchInput").value.trim();
      if (!query) {
        renderMapLayers(branchesData);
        updateCounters(branchesData, branchesData[0].name);
        map.setView([branchesData[0].lat, branchesData[0].lng], 12);
        return;
      }

      const matched = branchesData.filter((b) => b.name.includes(query));
      if (matched.length > 0) {
        renderMapLayers(matched);
        updateCounters(matched, matched[0].name);
        map.setView([matched[0].lat, matched[0].lng], 13);
      } else {
        document.getElementById("selectedZoneLabel").textContent = `لا توجد نتائج مطابقة لـ "${query}"`;
      }
    }

    document.getElementById("searchBtn").addEventListener("click", handleSearch);
    document.getElementById("areaSearchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        handleSearch();
      }
    });

    document.getElementById("clearSearchBtn").addEventListener("click", () => {
      document.getElementById("areaSearchInput").value = "";
      renderBranchesBar(branchesData[0].id);
      renderMapLayers(branchesData);
      updateCounters(branchesData, branchesData[0].name);
      map.setView([branchesData[0].lat, branchesData[0].lng], 12);
      map.invalidateSize();
    });

    window.addEventListener("load", initMap);
  </script>
</body>
</html>
